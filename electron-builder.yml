appId: com.multiw2.desktop
productName: MultiW2
directories:
  output: dist
files:
  - desktop/**
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md
  - '!node_modules/**'
extraResources:
  - from: .next/standalone/node_modules
    to: server/node_modules
    filter: ['**/*']
  - from: .next/standalone
    to: server
    filter:
      - '**/*'
      - '!**/.env*'
      - '!**/.git/**'
asar: true
npmRebuild: false
afterPack: scripts/verify-package.cjs
win:
  icon: public/brand/favicon-512.png
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  artifactName: MultiW2-Setup-${version}.${ext}
